name: Android

# Режим разработки: ничего никуда не публикуется. Результат — APK в артефактах запуска.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Тесты и APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Тесты (уровни проходимы, игра не падает)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Сборка debug и release APK
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Файлы с версией в имени
        id: ver
        run: |
          V=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk   "dist/bead-belt-$V-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/bead-belt-$V-release.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/bead-belt-$V-release.aab"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Подпись одним и тем же ключом?
        run: |
          for f in dist/*.apk; do
            echo "$f"
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$f" | grep -m1 "SHA-256" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bead-belt-${{ steps.ver.outputs.version }}
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
